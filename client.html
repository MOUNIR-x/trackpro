<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suivi colis — TrackPro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body.client-body {
        background: #f5f5f5;
        min-height: 100vh;
      }
      .client-shell {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .client-card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.04);
        overflow: hidden;
      }
      .client-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 28px;
        border-bottom: 1px solid #eee;
      }
      .client-search {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        max-width: 620px;
      }
      .client-search input {
        flex: 1;
        height: 52px;
        border: 1px solid #d4d4d4;
        border-radius: 12px;
        padding: 0 18px;
        font-size: 16px;
      }
      .btn-primary {
        height: 52px;
        padding: 0 22px;
      }
      .client-content {
        display: grid;
        grid-template-columns: 1.1fr 1.2fr;
        gap: 0;
      }
      .client-panel {
        padding: 24px 28px;
        border-right: 1px solid #eee;
      }
      .tracking-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .tracking-head h2 {
        margin: 0;
        font-size: 1.9rem;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(10,10,10,0.05);
      }
      .status-badge.success { background: rgba(22,163,74,0.12); color: #16a34a; }
      .status-badge.warning { background: rgba(217,119,6,0.12); color: #d97706; }
      .status-badge.danger { background: rgba(220,38,38,0.12); color: #dc2626; }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 20px;
      }
      .summary-box {
        background: #fafafa;
        border: 1px solid #ececec;
        border-radius: 12px;
        padding: 14px;
      }
      .summary-box .label {
        font-size: 12px;
        color: #737373;
        margin-bottom: 6px;
      }
      .summary-box .value {
        font-size: 16px;
        font-weight: 700;
      }
      .timeline {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .timeline-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .timeline-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-top: 5px;
        background: #d4d4d4;
      }
      .timeline-item.done .timeline-dot { background: #0a0a0a; }
      .timeline-title { font-weight: 700; }
      .timeline-desc { color: #6b7280; font-size: 13px; }
      .map-area {
        min-height: 640px;
        background: #f5f5f5;
      }
      #clientMap {
        width: 100%;
        height: 640px;
      }
      @media (max-width: 900px) {
        .client-shell {
          margin: 16px auto;
          padding: 0 12px;
        }
        .client-header {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
          padding: 16px 20px;
        }
        .client-search {
          max-width: 100%;
          width: 100%;
        }
        .client-search input {
          font-size: 16px; /* Empêche le zoom auto sur iPhone */
          height: 48px;
        }
        .client-search .btn-primary {
          height: 48px;
          padding: 0 18px;
        }
        .client-content {
          display: flex;
          flex-direction: column;
        }
        .map-area {
          order: 1;
          height: 340px;
          min-height: 300px;
        }
        #clientMap {
          height: 340px !important;
        }
        .client-panel {
          order: 2;
          border-right: none;
          border-bottom: 1px solid #eee;
          padding: 18px 16px;
        }
        .tracking-head {
          flex-wrap: wrap;
        }
        .tracking-head h2 {
          font-size: 1.5rem;
        }
      }
      @media (max-width: 480px) {
        .client-shell {
          margin: 8px auto;
          padding: 0 8px;
        }
        .summary-grid {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .map-area, #clientMap {
          height: 290px !important;
          min-height: 280px !important;
        }
      }
    </style>
  </head>
  <body class="client-body">
    <div class="client-shell">
      <div class="client-card">
        <div class="client-header">
          <a href="index.html" class="logo" aria-label="TrackPro home">
            <span class="logo-icon">◉</span>
            <span class="logo-text">TrackPro</span>
          </a>
          <div class="client-search">
            <input id="trackingNumber" type="text" placeholder="Entrez votre numéro de suivi" />
            <button class="btn btn-primary" onclick="trackColis()">Suivre</button>
          </div>
        </div>

        <div class="client-content">
          <div class="client-panel">
            <div id="trackingResult" style="display:none;">
              <div class="tracking-head">
                <div class="status-badge" id="resultStatus">En transit</div>
                <div class="summary-box" style="padding: 8px 12px; min-width: 170px;">
                  <div class="label">Mise à jour</div>
                  <div class="value" id="resultUpdatedAt">-</div>
                </div>
              </div>

              <h2>Colis <span id="resultTrackingNumber">-</span></h2>

              <div class="summary-box" style="margin-bottom: 16px; padding: 16px; background: linear-gradient(180deg, #fafafa, #f3f4f6);">
                <div class="label">Progression du colis</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin: 8px 0 12px;">
                  <div class="value" id="resultProgressText">0%</div>
                  <div class="value" id="resultEta">ETA —</div>
                </div>
                <div style="height: 10px; background: #ececec; border-radius: 999px; overflow: hidden;">
                  <div id="resultProgressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #101828, #28c76f); border-radius: inherit;"></div>
                </div>
              </div>

              <div class="summary-grid">
                <div class="summary-box">
                  <div class="label">Expéditeur</div>
                  <div class="value" id="resultExpediteur">-</div>
                </div>
                <div class="summary-box">
                  <div class="label">Destinataire</div>
                  <div class="value" id="resultDestinataire">-</div>
                </div>
                <div class="summary-box">
                  <div class="label">Origine</div>
                  <div class="value" id="resultOrigin">-</div>
                </div>
                <div class="summary-box">
                  <div class="label">Destination</div>
                  <div class="value" id="resultDestination">-</div>
                </div>
                <div class="summary-box" style="grid-column: 1 / -1;">
                  <div class="label">Adresse de livraison</div>
                  <div class="value" id="resultAdresse">-</div>
                </div>
                <div class="summary-box">
                  <div class="label">Distance restante</div>
                  <div class="value" id="resultDistanceRemaining">-</div>
                </div>
                <div class="summary-box">
                  <div class="label">Vitesse</div>
                  <div class="value" id="resultSpeed">-</div>
                </div>
                <div class="summary-box" style="grid-column: 1 / -1;">
                  <div class="label">Dernier événement</div>
                  <div class="value" id="resultLastEvent">-</div>
                </div>
                <div class="summary-box" style="grid-column: 1 / -1;">
                  <div class="label">Motif / état</div>
                  <div class="value" id="resultStatusReason">-</div>
                </div>
              </div>

              <div class="timeline" id="trackingTimeline"></div>
            </div>
          </div>

          <div class="map-area">
            <div id="clientMap" aria-label="Carte de suivi"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script src="client.js"></script>
  </body>
</html>
